[package]
name = "mainstream"
version = "0.1.0"
description = "Mainstream — macOS Life OS"
authors = ["you"]
edition = "2021"

[lib]
name = "mainstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# GHSA-w28w-mhc8-qvjv (2026-09-26): 2.11.5 and earlier store large channel
# responses under a process-wide monotonic id; another webview can fetch them.
# 2.11.6 binds the queue to the owning webview and randomizes ids.
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite 0.40 default-enables `cache`, which pulls hashlink 0.12.
# hashlink 0.12.0+ sets edition 2024 / MSRV 1.85, so `cargo test --locked`
# cannot even parse the crate on rustc 1.83. Statement-cache is LRU only;
# bundled SQLite still works without it.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# RUSTSEC-2026-0285 / GHSA-2mjx-qc3c-rqvc: rustls 0.23.13–0.23.44 accepted
# TLS 1.3 handshake messages at the wrong encryption level in the same record.
# default-features = false so we do not enable aws-lc-rs on top of reqwest's ring.
rustls = { version = "0.23.45", default-features = false }
feed-rs = "2"
csv = "1"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
keyring = { version = "3", features = ["apple-native"] }
urlencoding = "2"
base64 = "0.22"
quick-xml = "0.41"
zip = "2.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# 1.9.0 requires edition 2024 / rustc 1.85. Stay on 1.8.x so `cargo test --locked`
# works on the 1.83 toolchain and we do not pick up an unneeded MSRV jump.
zeroize = "=1.8.2"
zeroize_derive = "=1.4.2"
# 0.4.2+ sets edition 2024 / MSRV 1.85. Pin the derive macros so the lockfile
# stays parseable on the 1.83 toolchain (same class as the zeroize pin).
dlopen2_derive = "=0.4.1"
# time 0.3.45+ / time-macros 0.2.25+ set edition 2024. Stay on 0.3.44 so
# `cargo test --locked` works on rustc 1.83.
time = "=0.3.44"
time-macros = "=0.2.24"
# 1.2.2 sets edition 2024 / MSRV 1.86. Stay on 1.2.1 so `cargo test` can
# parse the lockfile on rustc 1.83 (same class as the time/zeroize pins).
idna_adapter = "=1.2.1"
# 0.1.10+ uses `unbounded_shr` (rustc 1.87). Stay on 0.1.9 so tests compile
# on the 1.86 toolchain available in this environment.
deflate64 = "=0.1.9"
# 2.14.0+ sets edition 2024 / MSRV 1.85. Stay on 2.13.1 so `cargo test --locked`
# can parse the lockfile on rustc 1.83 (same class as the idna_adapter pin).
indexmap = "=2.13.1"
